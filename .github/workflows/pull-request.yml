name: Pull Request

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

jobs:
  plan-common:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_aws_role_name: ${{ vars.AWS_ROLE_NAME }}
      TF_VAR_ghost_exports_bucket: ${{ vars.GHOST_EXPORTS_BUCKET }}
      TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
    outputs:
      ssm_tunnel_instance_profile: ${{ steps.plan-common.outputs.ssm_tunnel_instance_profile }}
      ses_smtp_username: ${{ steps.plan-common.outputs.ses_smtp_username }}
      ses_smtp_secret_arn: ${{ steps.plan-common.outputs.ses_smtp_secret_arn }}
      ses_smtp_host: ${{ steps.plan-common.outputs.ses_smtp_host }}
      ses_mail_from: ${{ steps.plan-common.outputs.ses_mail_from }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ACCOUNT_ID == '' || vars.AWS_ROLE_NAME == '' || vars.TF_STATE_BUCKET == '' || vars.ROUTE53_ZONE_NAME == ''
        run: exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Run Terraform Plan on Common items
        id: plan-common
        run: |
          export TF_LOG=DEBUG TF_LOG_PATH="$GITHUB_WORKSPACE/terraform-debug.log"
          terraform plan -input=false -no-color 2>&1 | tee "$GITHUB_WORKSPACE/default-plan.txt"; exit ${PIPESTATUS[0]}
          echo "ssm_tunnel_instance_profile=$(terraform output -raw ssm_tunnel_instance_profile)" >> $GITHUB_OUTPUT
          echo "ses_smtp_username=$(terraform output -raw ses_smtp_username)" >> $GITHUB_OUTPUT
          echo "ses_smtp_secret_arn=$(terraform output -raw ses_smtp_secret_arn)" >> $GITHUB_OUTPUT
          echo "ses_smtp_host=$(terraform output -raw ses_smtp_host)" >> $GITHUB_OUTPUT
          echo "ses_mail_from=$(terraform output -raw ses_mail_from)" >> $GITHUB_OUTPUT

      - name: Post Plan to PR
        if: always() && steps.plan-common.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const MAX_PLAN_LENGTH = 60000;
            const plan = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'default-plan.txt'), 'utf8');
            const truncated = plan.length > MAX_PLAN_LENGTH ? plan.slice(0, MAX_PLAN_LENGTH) + '\n... (truncated)' : plan;
            const willBeReplaced = plan.includes('must be replaced') || plan.includes('will be replaced');
            const outcome = '${{ steps.plan-common.outcome }}';
            const header = outcome === 'failure'
              ? '## ❌ Terraform Common Plan — plan failed'
              : willBeReplaced
                ? '## ⚠️ Terraform Common Plan — instance replacement detected (expect downtime)'
                : '## ✅ Terraform Common Plan';
            const body = `${header}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  plan-environment:
    runs-on: ubuntu-latest
    needs: plan-common
    strategy:
      matrix:
        environment: [test, prod]
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_environment: ${{ matrix.environment }}
      TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
      TF_VAR_subdomain: ${{ vars.SUBDOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ACCOUNT_ID == '' || vars.AWS_ROLE_NAME == '' ||
          vars.TF_STATE_BUCKET == '' || vars.ROUTE53_ZONE_NAME == '' || vars.SUBDOMAIN == ''
        run: exit 1

      - name: Set ghost_image variable if configured
        if: ${{ vars.GHOST_IMAGE != '' }}
        run: echo "TF_VAR_ghost_image=${{ vars.GHOST_IMAGE }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform -chdir=modules/ghost_site init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform -chdir=modules/ghost_site fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=modules/ghost_site validate

      # Selects workspace. If it doesn't exist yet, it creates it.
      - name: Select or Create Workspace
        run: terraform -chdir=modules/ghost_site workspace select ${{ matrix.environment }} || terraform -chdir=modules/ghost_site workspace new ${{ matrix.environment }}

      - name: Terraform Plan
        id: plan
        run: |
          ssm_tunnel_instance_profile=${{ needs.plan-common.outputs.ssm_tunnel_instance_profile }}
          ses_smtp_username=${{ needs.plan-common.outputs.ses_smtp_username }}
          ses_smtp_secret_arn=${{ needs.plan-common.outputs.ses_smtp_secret_arn }}
          ses_smtp_host=${{ needs.plan-common.outputs.ses_smtp_host }}
          ses_mail_from=${{ needs.plan-common.outputs.ses_mail_from }}
          export TF_LOG=DEBUG TF_LOG_PATH="$GITHUB_WORKSPACE/terraform-debug.log"
          terraform -chdir=modules/ghost_site plan \
            -var "ssm_tunnel_instance_profile=$ssm_tunnel_instance_profile" \
            -var "ses_smtp_username=$ses_smtp_username" \
            -var "ses_smtp_secret_arn=$ses_smtp_secret_arn" \
            -var "ses_smtp_host=$ses_smtp_host" \
            -var "ses_mail_from=$ses_mail_from" -input=false -no-color 2>&1 \
            | tee "$GITHUB_WORKSPACE/${{ matrix.environment }}-plan.txt"; exit ${PIPESTATUS[0]}

      - name: Post Plan to PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const MAX_PLAN_LENGTH = 60000;
            const plan = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, '${{ matrix.environment }}-plan.txt'), 'utf8');
            const truncated = plan.length > MAX_PLAN_LENGTH ? plan.slice(0, MAX_PLAN_LENGTH) + '\n... (truncated)' : plan;
            const willBeReplaced = plan.includes('must be replaced') || plan.includes('will be replaced');
            const outcome = '${{ steps.plan.outcome }}';
            const header = outcome === 'failure'
              ? '## ❌ Terraform Plan (${{ matrix.environment }}) — plan failed'
              : willBeReplaced
                ? '## ⚠️ Terraform Plan (${{ matrix.environment }}) — instance replacement detected (expect downtime)'
                : '## ✅ Terraform Plan (${{ matrix.environment }})';
            const body = `${header}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
