name: Pull Request

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}

jobs:
  plan-common:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_aws_role_name: ${{ vars.AWS_ROLE_NAME }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
    outputs:
      ssm_tunnel_instance_profile: ${{ steps.plan-common.outputs.ssm_tunnel_instance_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ACCOUNT_ID == '' || vars.AWS_ROLE_NAME == '' || vars.TF_STATE_BUCKET == ''
        run: exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Run Terraform Plan on Common items
        id: plan-common
        run: |
          export TF_LOG=DEBUG TF_LOG_PATH="$GITHUB_WORKSPACE/terraform-debug.log"
          terraform plan -input=false -no-color 2>&1 | tee "$GITHUB_WORKSPACE/default-plan.txt"; exit ${PIPESTATUS[0]}
          echo "ssm_tunnel_instance_profile=$(terraform output -raw ssm_tunnel_instance_profile)" >> $GITHUB_OUTPUT

      - name: Post Plan to PR
        if: always() && steps.plan-common.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const MAX_PLAN_LENGTH = 60000;
            const plan = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'default-plan.txt'), 'utf8');
            const truncated = plan.length > MAX_PLAN_LENGTH ? plan.slice(0, MAX_PLAN_LENGTH) + '\n... (truncated)' : plan;
            const willBeReplaced = plan.includes('must be replaced') || plan.includes('will be replaced');
            const outcome = '${{ steps.plan-common.outcome }}';
            const header = outcome === 'failure'
              ? '## ❌ Terraform Common Plan — plan failed'
              : willBeReplaced
                ? '## ⚠️ Terraform Common Plan — instance replacement detected (expect downtime)'
                : '## ✅ Terraform Common Plan';
            const body = `${header}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  plan-test:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: terraform
    needs: plan-common
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT_NAME }}
      TF_VAR_subdomain: ${{ vars.SUBDOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ACCOUNT_ID == '' || vars.AWS_ROLE_NAME == '' ||
          vars.TF_STATE_BUCKET == '' || vars.ROUTE53_ZONE_NAME == '' || vars.SUBDOMAIN == '' || vars.ENVIRONMENT_NAME == ''
        run: exit 1

      - name: Set ghost_image variable if configured
        if: ${{ vars.GHOST_IMAGE != '' }}
        run: echo "TF_VAR_ghost_image=${{ vars.GHOST_IMAGE }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform -chdir=modules/ghost_site init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform -chdir=modules/ghost_site fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=modules/ghost_site validate

      # Selects workspace. If it doesn't exist yet, it creates it.
      - name: Select or Create Workspace
        run: terraform -chdir=modules/ghost_site workspace select ${{ vars.ENVIRONMENT_NAME }} || terraform -chdir=modules/ghost_site workspace new ${{ vars.ENVIRONMENT_NAME }}

      - name: Terraform Plan
        id: plan-test
        run: |
          ssm_tunnel_instance_profile=${{ needs.plan-common.outputs.ssm_tunnel_instance_profile }}
          export TF_LOG=DEBUG TF_LOG_PATH="$GITHUB_WORKSPACE/terraform-debug.log"
          terraform -chdir=modules/ghost_site plan \
            -var "ssm_tunnel_instance_profile=$ssm_tunnel_instance_profile" -input=false -no-color 2>&1 \
            | tee "$GITHUB_WORKSPACE/${{ vars.ENVIRONMENT_NAME }}-plan.txt"; exit ${PIPESTATUS[0]}

      - name: Post Plan to PR
        if: always() && steps.plan-test.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const MAX_PLAN_LENGTH = 60000;
            const plan = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, '${{ vars.ENVIRONMENT_NAME }}-plan.txt'), 'utf8');
            const truncated = plan.length > MAX_PLAN_LENGTH ? plan.slice(0, MAX_PLAN_LENGTH) + '\n... (truncated)' : plan;
            const willBeReplaced = plan.includes('must be replaced') || plan.includes('will be replaced');
            const outcome = '${{ steps.plan-test.outcome }}';
            const header = outcome === 'failure'
              ? '## ❌ Terraform Plan — plan failed'
              : willBeReplaced
                ? '## ⚠️ Terraform Plan — instance replacement detected (expect downtime)'
                : '## ✅ Terraform Plan';
            const body = `${header}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
