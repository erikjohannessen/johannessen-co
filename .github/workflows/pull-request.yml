name: Pull Request

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_aws_role_name: ${{ vars.AWS_ROLE_NAME }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ROLE_ARN == '' || vars.AWS_ROLE_NAME == '' || vars.TF_STATE_BUCKET == ''
        run: exit 1

      - name: Set ghost_image variable if configured
        if: ${{ vars.GHOST_IMAGE != '' }}
        run: echo "TF_VAR_ghost_image=${{ vars.GHOST_IMAGE }}" >> $GITHUB_ENV

      - name: Set local_dev_ip variable if configured
        if: ${{ vars.LOCAL_DEV_IP != '' }}
        run: echo "TF_VAR_local_dev_ip=${{ vars.LOCAL_DEV_IP }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          export TF_LOG=DEBUG TF_LOG_PATH="$GITHUB_WORKSPACE/terraform-debug.log"
          terraform plan -input=false -out=tfplan -no-color 2>&1 | tee "$GITHUB_WORKSPACE/plan.txt"; exit ${PIPESTATUS[0]}

      - name: Post Plan to PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const MAX_PLAN_LENGTH = 60000;
            const plan = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'plan.txt'), 'utf8');
            const truncated = plan.length > MAX_PLAN_LENGTH ? plan.slice(0, MAX_PLAN_LENGTH) + '\n... (truncated)' : plan;
            const willBeReplaced = plan.includes('must be replaced') || plan.includes('will be replaced');
            const outcome = '${{ steps.plan.outcome }}';
            const header = outcome === 'failure'
              ? '## ❌ Terraform Plan — plan failed'
              : willBeReplaced
                ? '## ⚠️ Terraform Plan — instance replacement detected (expect downtime)'
                : '## ✅ Terraform Plan';
            const body = `${header}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
