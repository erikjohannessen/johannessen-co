name: Push

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ghost_image: ${{ vars.GHOST_IMAGE }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_aws_role_name: ${{ vars.AWS_ROLE_NAME }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ROLE_ARN == '' || vars.AWS_ROLE_NAME == '' || vars.TF_STATE_BUCKET == ''
        run: exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -out=tfplan -no-color 2>&1 | tee "$GITHUB_WORKSPACE/plan.txt"; exit ${PIPESTATUS[0]}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan

      - name: Wait for ECS services
        run: |
          test_cluster=$(terraform output -raw test_ecs_cluster_name)
          test_service=$(terraform output -raw test_ecs_service_name)
          prod_cluster=$(terraform output -raw prod_ecs_cluster_name)
          prod_service=$(terraform output -raw prod_ecs_service_name)
          echo "Waiting for ECS service to become stable: $test_cluster / $test_service"
          aws ecs wait services-stable --cluster "$test_cluster" --services "$test_service"
          echo "Waiting for ECS service to become stable: $prod_cluster / $prod_service"
          aws ecs wait services-stable --cluster "$prod_cluster" --services "$prod_service"

      - name: Wait for RDS instances
        run: |
          test_db_id=$(terraform output -raw test_db_instance_identifier)
          prod_db_id=$(terraform output -raw prod_db_instance_identifier)
          echo "Waiting for RDS instance: $test_db_id"
          aws rds wait db-instance-available --db-instance-identifier "$test_db_id"
          echo "Waiting for RDS instance: $prod_db_id"
          aws rds wait db-instance-available --db-instance-identifier "$prod_db_id"

      - name: Smoke Test
        run: |
          pairs=(
            "test.johannessen.co"
            "blog.johannessen.co"
          )
          for host in "${pairs[@]}"; do
            case "$host" in
               test.johannessen.co) alb_dns_name=$(terraform output -raw test_alb_dns_name) ;;
               blog.johannessen.co) alb_dns_name=$(terraform output -raw prod_alb_dns_name) ;;
               *) echo "Unknown host: $host" && exit 1 ;;
            esac
            echo "Smoke testing https://$host (via $alb_dns_name)..."
            body=$(curl -sL --max-time 20 --connect-to "$host:443:$alb_dns_name:443" "https://$host/")
            if echo "$body" | grep -qi "<html"; then
              echo "✓ $host returned HTML content"
            else
              echo "✗ $host did not return HTML content"
              exit 1
            fi
          done
