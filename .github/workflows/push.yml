name: Push

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      local_dev_ip:
        description: "Optional public IPv4 for MySQL access (without /32)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy-common:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_aws_role_name: ${{ vars.AWS_ROLE_NAME }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}
    outputs:
      ssm_tunnel_instance_profile: ${{ steps.apply-common.outputs.ssm_tunnel_instance_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ROLE_ARN == '' || vars.AWS_ROLE_NAME == '' || vars.TF_STATE_BUCKET == ''
        run: exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Run Terraform Plan on Common Resources
        run: |
          export TF_LOG=DEBUG TF_LOG_PATH="$GITHUB_WORKSPACE/terraform-debug.log"
          terraform plan -input=false -out=tfplan-common -no-color

      - name: Terraform Apply Common Resources
        id: apply-common
        run: |
          terraform apply -auto-approve -no-color tfplan-common
          echo "ssm_tunnel_instance_profile=$(terraform output -raw ssm_tunnel_instance_profile)" >> $GITHUB_OUTPUT

  deploy-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    needs: deploy-common
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_route53_zone_name: johannessen.co
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_aws_role_name: ${{ vars.AWS_ROLE_NAME }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ROLE_ARN == '' || vars.AWS_ROLE_NAME == '' || vars.TF_STATE_BUCKET == ''
        run: exit 1

      - name: Set ghost_image variable if configured
        if: ${{ vars.GHOST_IMAGE != '' }}
        run: echo "TF_VAR_ghost_image=${{ vars.GHOST_IMAGE }}" >> $GITHUB_ENV

      - name: Set local_dev_ip variable if configured
        env:
          INPUT_LOCAL_DEV_IP: ${{ github.event.inputs.local_dev_ip || '' }}
          VAR_LOCAL_DEV_IP: ${{ vars.LOCAL_DEV_IP || '' }}
        run: |
          local_dev_ip="$INPUT_LOCAL_DEV_IP"
          if [ -z "$local_dev_ip" ]; then
            local_dev_ip="$VAR_LOCAL_DEV_IP"
          fi

          if [ -n "$local_dev_ip" ]; then
            echo "TF_VAR_local_dev_ip=$local_dev_ip" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform -chdir=modules/ghost_site init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform -chdir=modules/ghost_site fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=modules/ghost_site validate

      # Selects the test workspace. If it doesn't exist yet, it creates it.
      - name: Select or Create Test Workspace
        run: terraform -chdir=modules/ghost_site workspace select test || terraform -chdir=modules/ghost_site workspace new test

      - name: Terraform Plan Test Environment
        run: |
          ssm_tunnel_instance_profile=${{ needs.deploy-common.outputs.ssm_tunnel_instance_profile }}
          terraform -chdir=modules/ghost_site plan -var "environment=test" -var "subdomain=test" \
            -var "ssm_tunnel_instance_profile=$ssm_tunnel_instance_profile" -input=false -out=tfplan-test -no-color

      - name: Terraform Apply Test Environment
        run: terraform -chdir=modules/ghost_site apply -auto-approve -no-color tfplan-test

      - name: Wait for Test RDS instances
        run: |
          db_id=$(terraform -chdir=modules/ghost_site output -raw db_instance_identifier)
          echo "Waiting for RDS instance: $db_id"
          aws rds wait db-instance-available --db-instance-identifier "$db_id"

      - name: Wait for Test ECS services
        run: |
          cluster=$(terraform -chdir=modules/ghost_site output -raw ecs_cluster_name)
          service=$(terraform -chdir=modules/ghost_site output -raw ecs_service_name)
          echo "Waiting for ECS service to become stable: $cluster / $service"
          aws ecs wait services-stable --cluster "$cluster" --services "$service"

      - name: Test Environment Smoke Test
        run: |
          host=$(terraform -chdir=modules/ghost_site output -raw hostname)
          alb_dns_name=$(terraform -chdir=modules/ghost_site output -raw alb_dns_name)
          echo "Smoke testing https://$host (via $alb_dns_name)..."
          body=$(curl -sL --max-time 20 --connect-to "$host:443:$alb_dns_name:443" "https://$host/")
          if echo "$body" | grep -qi "<html"; then
            echo "✓ $host returned HTML content"
          else
            echo "✗ $host did not return HTML content"
            exit 1
          fi

  deploy-prod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    needs: [deploy-common, deploy-test]
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_route53_zone_name: johannessen.co
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_aws_role_name: ${{ vars.AWS_ROLE_NAME }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ROLE_ARN == '' || vars.AWS_ROLE_NAME == '' || vars.TF_STATE_BUCKET == ''
        run: exit 1

      - name: Set ghost_image variable if configured
        if: ${{ vars.GHOST_IMAGE != '' }}
        run: echo "TF_VAR_ghost_image=${{ vars.GHOST_IMAGE }}" >> $GITHUB_ENV

      - name: Set local_dev_ip variable if configured
        env:
          INPUT_LOCAL_DEV_IP: ${{ github.event.inputs.local_dev_ip || '' }}
          VAR_LOCAL_DEV_IP: ${{ vars.LOCAL_DEV_IP || '' }}
        run: |
          local_dev_ip="$INPUT_LOCAL_DEV_IP"
          if [ -z "$local_dev_ip" ]; then
            local_dev_ip="$VAR_LOCAL_DEV_IP"
          fi

          if [ -n "$local_dev_ip" ]; then
            echo "TF_VAR_local_dev_ip=$local_dev_ip" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform -chdir=modules/ghost_site init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        run: terraform -chdir=modules/ghost_site fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=modules/ghost_site validate

      # Selects the prod workspace. If it doesn't exist yet, it creates it.
      - name: Select or Create Prod Workspace
        run: terraform -chdir=modules/ghost_site workspace select prod || terraform -chdir=modules/ghost_site workspace new prod

      - name: Terraform Plan Prod Environment
        run: |
          ssm_tunnel_instance_profile=${{ needs.deploy-common.outputs.ssm_tunnel_instance_profile }}
          terraform -chdir=modules/ghost_site plan -var "environment=prod" -var "subdomain=blog" \
            -var "ssm_tunnel_instance_profile=$ssm_tunnel_instance_profile" -input=false -out=tfplan-prod -no-color

      - name: Terraform Apply Prod Environment
        run: terraform -chdir=modules/ghost_site apply -auto-approve -no-color tfplan-prod

      - name: Wait for Prod RDS instances
        run: |
          db_id=$(terraform -chdir=modules/ghost_site output -raw db_instance_identifier)
          echo "Waiting for RDS instance: $db_id"
          aws rds wait db-instance-available --db-instance-identifier "$db_id"

      - name: Wait for Prod ECS services
        run: |
          cluster=$(terraform -chdir=modules/ghost_site output -raw ecs_cluster_name)
          service=$(terraform -chdir=modules/ghost_site output -raw ecs_service_name)
          echo "Waiting for ECS service to become stable: $cluster / $service"
          aws ecs wait services-stable --cluster "$cluster" --services "$service"

      - name: Prod Environment Smoke Test
        run: |
          host=$(terraform -chdir=modules/ghost_site output -raw hostname)
          alb_dns_name=$(terraform -chdir=modules/ghost_site output -raw alb_dns_name)
          echo "Smoke testing https://$host (via $alb_dns_name)..."
          body=$(curl -sL --max-time 20 --connect-to "$host:443:$alb_dns_name:443" "https://$host/")
          if echo "$body" | grep -qi "<html"; then
            echo "✓ $host returned HTML content"
          else
            echo "✗ $host did not return HTML content"
            exit 1
          fi
