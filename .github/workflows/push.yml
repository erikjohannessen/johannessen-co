name: Push

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      local_dev_ip:
        description: "Optional public IPv4 for MySQL access (without /32)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_route53_zone_name: johannessen.co
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_aws_role_name: ${{ vars.AWS_ROLE_NAME }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if critical environment variables are not set
        if: vars.AWS_REGION == '' || vars.AWS_ROLE_ARN == '' || vars.AWS_ROLE_NAME == '' || vars.TF_STATE_BUCKET == ''
        run: exit 1

      - name: Set ghost_image variable if configured
        if: ${{ vars.GHOST_IMAGE != '' }}
        run: echo "TF_VAR_ghost_image=${{ vars.GHOST_IMAGE }}" >> $GITHUB_ENV

      - name: Set local_dev_ip variable if configured
        env:
          INPUT_LOCAL_DEV_IP: ${{ github.event.inputs.local_dev_ip || '' }}
          VAR_LOCAL_DEV_IP: ${{ vars.LOCAL_DEV_IP || '' }}
        run: |
          local_dev_ip="$INPUT_LOCAL_DEV_IP"
          if [ -z "$local_dev_ip" ]; then
            local_dev_ip="$VAR_LOCAL_DEV_IP"
          fi

          if [ -n "$local_dev_ip" ]; then
            echo "TF_VAR_local_dev_ip=$local_dev_ip" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (with backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Get default workspace
        run: terraform workspace select default

      - name: Get backup of current state
        run: terraform state pull > backup.tfstate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # Selects the test workspace. If it doesn't exist yet, it creates it.
      - name: Select or Create Test Workspace
        run: terraform workspace select test || terraform workspace new test

      # temporarily apply the backup state to the test workspace so that the plan can be generated correctly
      - name: Apply backup state to Test workspace
        run: terraform state push -force backup.tfstate

      - name: Terraform Plan Test Environment
        id: plan
        run: terraform plan -var "environment=test" -var "subdomain=test" -input=false -out=tfplan-test -no-color 2>&1 | tee "$GITHUB_WORKSPACE/plan.txt"; exit ${PIPESTATUS[0]}

      - name: Terraform Apply Test Environment
        run: terraform apply -auto-approve -no-color tfplan-test

      - name: Wait for Test RDS instances
        run: |
          db_id=$(terraform output -raw db_instance_identifier)
          echo "Waiting for RDS instance: $db_id"
          aws rds wait db-instance-available --db-instance-identifier "$db_id"

      - name: Wait for Test ECS services
        run: |
          cluster=$(terraform output -raw ecs_cluster_name)
          service=$(terraform output -raw ecs_service_name)
          echo "Waiting for ECS service to become stable: $cluster / $service"
          aws ecs wait services-stable --cluster "$cluster" --services "$service"

      - name: Test Environment Smoke Test
        run: |
          host=$(terraform output -raw hostname)
          alb_dns_name=$(terraform output -raw alb_dns_name)
          echo "Smoke testing https://$host (via $alb_dns_name)..."
          body=$(curl -sL --max-time 20 --connect-to "$host:443:$alb_dns_name:443" "https://$host/")
          if echo "$body" | grep -qi "<html"; then
            echo "✓ $host returned HTML content"
          else
            echo "✗ $host did not return HTML content"
            exit 1
          fi

      # Selects the prod workspace. If it doesn't exist yet, it creates it.
      - name: Select or Create Prod Workspace
        run: terraform workspace select prod || terraform workspace new prod

      # temporarily apply the backup state to the prod workspace so that the plan can be generated correctly
      - name: Apply backup state to Prod workspace
        run: terraform state push -force backup.tfstate

      - name: Terraform Plan Prod Environment
        id: plan-prod
        run: terraform plan -var "environment=prod" -var "subdomain=blog" -input=false -out=tfplan-prod -no-color 2>&1 | tee "$GITHUB_WORKSPACE/plan.txt"; exit ${PIPESTATUS[0]}

      - name: Terraform Apply Prod Environment
        run: terraform apply -auto-approve -no-color tfplan-prod

      - name: Wait for Prod RDS instances
        run: |
          db_id=$(terraform output -raw db_instance_identifier)
          echo "Waiting for RDS instance: $db_id"
          aws rds wait db-instance-available --db-instance-identifier "$db_id"

      - name: Wait for Prod ECS services
        run: |
          cluster=$(terraform output -raw ecs_cluster_name)
          service=$(terraform output -raw ecs_service_name)
          echo "Waiting for ECS service to become stable: $cluster / $service"
          aws ecs wait services-stable --cluster "$cluster" --services "$service"

      - name: Prod Environment Smoke Test
        run: |
          host=$(terraform output -raw hostname)
          alb_dns_name=$(terraform output -raw alb_dns_name)
          echo "Smoke testing https://$host (via $alb_dns_name)..."
          body=$(curl -sL --max-time 20 --connect-to "$host:443:$alb_dns_name:443" "https://$host/")
          if echo "$body" | grep -qi "<html"; then
            echo "✓ $host returned HTML content"
          else
            echo "✗ $host did not return HTML content"
            exit 1
          fi
