name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'ghost/terraform.tfstate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Init (with backend)
        if: vars.TF_STATE_BUCKET != ''
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="use_lockfile=true" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Plan
        if: github.event_name == 'pull_request' && vars.TF_STATE_BUCKET != ''
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_STATE_BUCKET != ''
        run: terraform apply -auto-approve -no-color

      - name: Health Check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_STATE_BUCKET != ''
        run: |
          max_attempts=10
          retry_sleep=20
          for url in "http://test.johannessen.co/health" "http://blog.johannessen.co/health"; do
            echo "Checking $url..."
            for i in $(seq 1 $max_attempts); do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
              curl_exit=$?
              [ "$curl_exit" -ne 0 ] && echo "curl failed (exit $curl_exit: 28=timeout, 6=DNS error, 7=connection refused)"
              if [ "$status" = "200" ]; then
                echo "✓ $url returned HTTP 200"
                break
              fi
              if [ "$i" -eq "$max_attempts" ]; then
                echo "✗ $url did not return HTTP 200 after $max_attempts attempts (last status: $status)"
                exit 1
              fi
              echo "Attempt $i: got HTTP $status, retrying in ${retry_sleep}s..."
              sleep "$retry_sleep"
            done
          done
